  var LIVE_MIN = 0.0015;              /* share of the disc below which an issue leaves */
  function liveIds() {
    if (!TFX) { var all = []; for (var k = 0; k < N; k++) all.push(k); return all; }
    var tot = totalNow(), ids = [];
    for (var i = 0; i < N; i++) if (TFX.area[i] / tot > LIVE_MIN) ids.push(i);
    return ids.length ? ids : [0];
  }
  function playItems(ids) {
    return ids.map(function (i) {
      var s = ST[i], x = 0, y = 0, n = 0;
      s[4].forEach(function (o) { x += PRESS[o][0]; y += PRESS[o][1]; n++; });
      return { ang: Math.atan2(y / n, x / n), rankKey: -s[4].length, area: areaOf(i) };
    });
  }

  /* warm-started refit: seeds and weights carried over from the last frame */
  function relayout(prev, items, G, iters, relax, ids) {
    var n = items.length, i, tot = 0;
    for (i = 0; i < n; i++) tot += items[i].area;
    var target = new Float64Array(n);
    for (i = 0; i < n; i++) target[i] = items[i].area / tot;
    var ord = []; for (i = 0; i < n; i++) ord.push(i);
    ord.sort(function (p, q) { return items[p].rankKey - items[q].rankKey; });
    var tr = new Float64Array(n);
    ord.forEach(function (idx, rank) { tr[idx] = 0.09 + 0.83 * (n > 1 ? rank / (n - 1) : 0); });
    /* carry each surviving cell's seed and weight across by issue id; an issue
       that has just arrived starts at its own anchor with the smallest weight
       in play, so it grows out of the gutter rather than appearing full size */
    var sx = new Float64Array(n), sy = new Float64Array(n), w = new Float64Array(n);
    var prevIx = {}, minW = 0;
    if (prev.ids) prev.ids.forEach(function (id, k) { prevIx[id] = k; });
    for (i = 0; i < prev.n; i++) if (prev.w[i] < minW) minW = prev.w[i];
    for (i = 0; i < n; i++) {
      var k = (ids && prev.ids) ? prevIx[ids[i]] : i;
      if (k == null || k >= prev.n) {
        sx[i] = tr[i] * Math.cos(items[i].ang);
        sy[i] = tr[i] * Math.sin(items[i].ang);
        w[i] = minW - 0.05;
      } else { sx[i] = prev.sx[k]; sy[i] = prev.sy[k]; w[i] = prev.w[k]; }
    }
    var rad = new Float64Array(n), ang = new Float64Array(n);
    for (i = 0; i < n; i++) { ang[i] = items[i].ang; rad[i] = Math.sqrt(target[i]); }
    for (var it = 0; it < relax; it++) {
      for (var a = 0; a < n; a++) for (var b = a + 1; b < n; b++) {
        var dx = sx[b] - sx[a], dy = sy[b] - sy[a];
        var dd = Math.sqrt(dx * dx + dy * dy) || 1e-6, md = (rad[a] + rad[b]) * 1.05;
        if (dd < md) {
          var push = ((md - dd) / 2) * 0.45 / dd;
          sx[a] -= dx * push; sy[a] -= dy * push;
          sx[b] += dx * push; sy[b] += dy * push;
        }
      }
      for (var c = 0; c < n; c++) {
        var r = Math.sqrt(sx[c] * sx[c] + sy[c] * sy[c]) || 1e-6;
        var th = Math.atan2(sy[c], sx[c]);
        var da = (th - ang[c] + Math.PI * 3) % (Math.PI * 2) - Math.PI;
        th = ang[c] + da * 0.92;
        var rr = Math.min(tr[c] + 0.14, Math.max(tr[c] - 0.14, r));
        sx[c] = rr * Math.cos(th); sy[c] = rr * Math.sin(th);
      }
    }
    var gx = [], gy = [];
    for (var j = 0; j < G; j++) {
      var py = (j + 0.5) / G * 2 - 1;
      for (var k = 0; k < G; k++) {
        var px = (k + 0.5) / G * 2 - 1;
        if (px * px + py * py <= 1) { gx.push(px); gy.push(py); }
      }
    }
    var M = gx.length, GX = Float64Array.from(gx), GY = Float64Array.from(gy);
    var cnt = new Float64Array(n);
    for (var t = 0; t < iters; t++) {
      cnt.fill(0);
      for (var m = 0; m < M; m++) {
        var bi = 0, bv = Infinity, X = GX[m], Y = GY[m];
        for (var q = 0; q < n; q++) {
          var ex = X - sx[q], ey = Y - sy[q], v = ex * ex + ey * ey - w[q];
          if (v < bv) { bv = v; bi = q; }
        }
        cnt[bi]++;
      }
      var mean = 0;
      for (var z = 0; z < n; z++) {
        var got = cnt[z] / M;
        w[z] += 0.30 * (target[z] - got) * 2.4;
        if (got === 0) w[z] += 0.06;                 /* squeezed out: kick it back */
        else if (got < target[z] * 0.25) w[z] += 0.02;
        w[z] = clamp(w[z], -1.6, 1.6);
        mean += w[z];
      }
      mean /= n;
      for (var z2 = 0; z2 < n; z2++) w[z2] -= mean;
    }
    return { sx: sx, sy: sy, w: w, n: n, ids: ids || (prev.ids || null) };
  }

  /* ---------- the strip ---------- */
  var tlc = document.getElementById("tlCanvas");
  var tctx = tlc ? tlc.getContext("2d") : null;
  var tlCap = document.getElementById("tlCap");
  var tlDate = document.getElementById("tlDate");
  var tlOff = document.createElement("canvas");
  var TLW = 0, TLH = 214, TLDPR = 1;
  var PIN_Y = 12, STR_T = 28, STR_B = 178, AX_Y = 190;
  var pos = HDAYS - 1;                 /* fractional frame index */
  var capUntil = 0, capEv = -1;

  var RGUT = 44;                     /* room for the axis labels on the right */
  function plotW() { return Math.max(60, TLW - RGUT); }
  function xOf(f) { return TLW <= 1 ? 0 : f / (HDAYS - 1) * (plotW() - 1); }
  function fOf(x) { return clamp(x / Math.max(1, plotW() - 1) * (HDAYS - 1), 0, HDAYS - 1); }

  /* ---------- the comparison chart ----------
     One line per selected issue: x is time, y is that issue's share of all
     national coverage that day. Colour here is identity, not stance: with
     several lines crossing, telling them apart is what matters, and the sphere
     above still carries the red-to-green reading. A line stops where the issue
     left the globe and starts again where it came back. */
  var SEL = [], SELO = [], SELP = [], CHART_STORY = -1, CHART_PAPER = null;
  var PAPER_CACHE = null, SELMODE = false, SLOT = {};
  var SER_N = 14;   /* the widest story in the set runs in thirteen papers */
  function serColour(key) {
    var k = SLOT[key] == null ? 0 : SLOT[key];
    return getComputedStyle(document.documentElement)
             .getPropertyValue("--ser-" + (k % SER_N)).trim() || "#888";
  }
  function takeSlot(key, siblings) {
    var used = {};
    (siblings || []).forEach(function (j) { if (j !== key && SLOT[j] != null) used[SLOT[j]] = 1; });
    for (var k = 0; k < SER_N; k++) if (!used[k]) { SLOT[key] = k; return; }
    SLOT[key] = 0;
  }

  /* The chart follows whatever globe is on screen. On the main globe each line
     is an issue's share of all national coverage; inside a story each line is
     one paper's share of that story, which is the same question asked of the
     press rather than of the news. */
  function chartStory() { return CHART_STORY; }
  function outletShareAt(si, name, f) {
    var outs = ST[si][4], tot = 0;
    for (var k = 0; k < outs.length; k++) tot += outletSalAt(si, outs[k], f);
    return { v: tot > 0 ? outletSalAt(si, name, f) / tot : 0, live: shareAt(si, f).live };
  }
  function seriesNow() {
    if (CHART_PAPER && PAPER_CACHE) {
      var pc = PAPER_CACHE, w = pc.ids.length;
      return SELP.map(function (si) {
        var k = pc.ids.indexOf(si);
        return { key: "p:" + si, label: ST[si][1], col: serColour("p:" + si), ev: si,
                 at: function (f) {
                   var f0 = Math.floor(f), f1 = Math.min(HDAYS - 1, f0 + 1), u = f - f0;
                   return { v: pc.m[f0 * w + k] * (1 - u) + pc.m[f1 * w + k] * u,
                            live: shareAt(si, f).live };
                 } };
      });
    }
    if (CHART_STORY >= 0) {
      var si = CHART_STORY;
      return SELO.map(function (nm) {
        return { key: "o:" + nm, label: nm, col: serColour("o:" + nm), ev: si,
                 at: function (f) { return outletShareAt(si, nm, f); } };
      });
    }
    return SEL.map(function (i) {
      return { key: "i:" + i, label: ST[i][1], col: serColour("i:" + i), ev: i,
               at: function (f) { return shareAt(i, f); } };
    });
  }
  /* one paper's own agenda over time: each line is the share of that paper's
     output going on an issue, which sums to its whole front page */
  function setChartPaper(name) {
    CHART_PAPER = name; CHART_STORY = -1;
    var ids = [], i, k, f;
    for (i = 0; i < N; i++) if (ST[i][4].indexOf(name) >= 0) ids.push(i);
    var w = ids.length, M = new Float64Array(HDAYS * w), means = [];
    for (k = 0; k < w; k++) means.push(0);
    for (f = 0; f < HDAYS; f++) {
      var row = [], tot = 0;
      for (k = 0; k < w; k++) {
        var si = ids[k], t2 = 0;
        ST[si][4].forEach(function (o) { t2 += outletSalAt(si, o, f); });
        var v = t2 > 0 ? shareAt(si, f).v * outletSalAt(si, name, f) / t2 : 0;
        row.push(v); tot += v;
      }
      for (k = 0; k < w; k++) {
        M[f * w + k] = tot > 0 ? row[k] / tot : 0;
        means[k] += M[f * w + k];
      }
    }
    PAPER_CACHE = { name: name, ids: ids, m: M };
    var ord = ids.map(function (si, k2) { return [si, means[k2]]; });
    ord.sort(function (a, b) { return b[1] - a[1]; });
    SELP = ord.slice(0, 6).map(function (r) { return r[0]; });
    SELP.forEach(function (si) {
      takeSlot("p:" + si, SELP.map(function (q) { return "p:" + q; }));
    });
    var note = document.getElementById("tlNote");
    if (note) note.innerHTML = "Every Story In The " + name + " \u00b7 Real Coverage";
    buildStream();
  }

  function setChartStory(si) {
    CHART_STORY = si; CHART_PAPER = null;
    if (si >= 0) {
      SELO = ST[si][4].slice();
      SELO.forEach(function (nm) { takeSlot("o:" + nm, SELO.map(function (q) { return "o:" + q; })); });
    }
    var note = document.getElementById("tlNote");
    if (note) {
      note.innerHTML = si >= 0
        ? "The Papers On " + ST[si][1] + " \u00b7 Real Coverage"
        : "Compare Stories Over " + FPM.D + " Days \u00b7 Real Coverage";
    }
    buildStream();
  }
  function defaultSel() {
    var m = [];
    for (var i = 0; i < N; i++) {
      var t = 0;
      for (var f = 0; f < HDAYS; f++) t += HIST.share[f * N + i];
      m.push([i, t]);
    }
    m.sort(function (a, b) { return b[1] - a[1]; });
    return [m[0][0], m[3][0], m[8][0]];
  }
  function shareAt(i, f) {
    var f0 = Math.floor(f), f1 = Math.min(HDAYS - 1, f0 + 1), u = f - f0, tot = 0;
    for (var k = 0; k < N; k++) {
      tot += HIST.share[f0 * N + k] * (1 - u) + HIST.share[f1 * N + k] * u;
    }
    var v = HIST.share[f0 * N + i] * (1 - u) + HIST.share[f1 * N + i] * u;
    return { v: v / tot, live: v / tot > LIVE_MIN };
  }
  function stanceAt(i, f) {
    var f0 = Math.floor(f), f1 = Math.min(HDAYS - 1, f0 + 1), u = f - f0;
    return clamp(ST[i][3] + HIST.dst[f0 * N + i] * (1 - u) + HIST.dst[f1 * N + i] * u, -2, 2);
  }

  function buildStream() {
    if (!tctx) return;
    var cssW = stage.getBoundingClientRect().width;
    if (!cssW) return;
    if (CHART_STORY < 0 && !CHART_PAPER && !SEL.length) {
      SEL = defaultSel();
      SEL.forEach(function (i) { takeSlot("i:" + i, SEL.map(function (q) { return "i:" + q; })); });
    }
    var SER = seriesNow();
    TLDPR = Math.min(window.devicePixelRatio || 1, 2);
    TLW = Math.round(cssW);
    tlc.style.width = TLW + "px"; tlc.style.height = TLH + "px";
    tlc.width = Math.round(TLW * TLDPR); tlc.height = Math.round(TLH * TLDPR);
    tlOff.width = tlc.width; tlOff.height = tlc.height;
    var g = tlOff.getContext("2d");
    g.setTransform(TLDPR, 0, 0, TLDPR, 0, 0);
    g.clearRect(0, 0, TLW, TLH);

    var pal = palette();
    var cs = getComputedStyle(document.documentElement);
    var rule = cs.getPropertyValue("--rule").trim();
    var soft = cs.getPropertyValue("--rule-soft").trim();
    var ink3 = cs.getPropertyValue("--ink-3").trim();
    var H = STR_B - STR_T, PW = plotW();

    /* one scale for every line, so the comparison is honest */
    var peak = 0;
    SER.forEach(function (sr) {
      for (var f = 0; f < HDAYS; f++) {
        var v = sr.at(f).v;
        if (v > peak) peak = v;
      }
    });
    peak = Math.max(0.02, peak * 1.12);
    var yOf = function (v) { return STR_B - clamp(v / peak, 0, 1) * H; };

    g.strokeStyle = soft; g.lineWidth = 1;
    g.fillStyle = ink3; g.font = '9px "IBM Plex Mono", monospace';
    g.textAlign = "left"; g.textBaseline = "middle";
    var step = peak > 0.15 ? 0.05 : peak > 0.08 ? 0.02 : 0.01;
    for (var gv = step; gv < peak; gv += step) {
      var gy = Math.round(yOf(gv)) + 0.5;
      g.beginPath(); g.moveTo(0, gy); g.lineTo(PW, gy); g.stroke();
      g.fillText((gv * 100).toFixed(0) + "%", PW + 6, gy);
    }
    g.strokeStyle = rule;
    g.beginPath(); g.moveTo(0, STR_B + 0.5); g.lineTo(PW, STR_B + 0.5); g.stroke();

    /* days nothing was collected: shaded and labelled, so a bridged stretch
       of line is never mistaken for coverage */
    Object.keys(FPM.GAPS).forEach(function (k) {
      var f = +k, x0 = Math.max(0, xOf(f - 0.5)), x1 = Math.min(PW, xOf(f + 0.5));
      g.save();
      g.globalAlpha = 0.55; g.fillStyle = soft;
      g.fillRect(x0, STR_T, x1 - x0, STR_B - STR_T);
      g.restore();
    });
    (function () {
      /* one label per run of consecutive missing days */
      var fs = Object.keys(FPM.GAPS).map(Number).sort(function (a, b) { return a - b; });
      g.save(); g.fillStyle = ink3; g.font = '8.5px "IBM Plex Mono", monospace';
      g.textAlign = "center"; g.textBaseline = "top";
      for (var i = 0; i < fs.length; i++) {
        if (i && fs[i] === fs[i - 1] + 1) continue;
        var j = i; while (j + 1 < fs.length && fs[j + 1] === fs[j] + 1) j++;
        var mid = (xOf(fs[i] - 0.5) + xOf(fs[j] + 0.5)) / 2;
        var w = xOf(fs[j] + 0.5) - xOf(fs[i] - 0.5);
        if (w > 44) g.fillText("not collected", mid, STR_T + 3);
      }
      g.restore();
    })();

    /* the lines, coloured segment by segment */
    g.lineWidth = 2; g.lineCap = "round"; g.lineJoin = "round";
    SER.forEach(function (sr) {
      g.strokeStyle = sr.col;
      var run = false;
      g.beginPath();
      for (var x = 0; x < PW; x++) {
        var f = x / (PW - 1) * (HDAYS - 1);
        var sa = sr.at(f), cy = yOf(sa.v);
        if (!sa.live) { if (run) { g.stroke(); g.beginPath(); run = false; } continue; }
        if (run) g.lineTo(x, cy); else { g.moveTo(x, cy); run = true; }
      }
      if (run) g.stroke();
      var lv = sr.at(HDAYS - 1);
      if (!lv.live) return;
      g.fillStyle = sr.col;
      g.beginPath(); g.arc(PW - 1, yOf(lv.v), 2.8, 0, Math.PI * 2); g.fill();
    });

    /* month ticks */
    g.strokeStyle = rule; g.lineWidth = 1; g.fillStyle = ink3;
    g.font = '9.5px "IBM Plex Mono", monospace';
    g.textAlign = "left"; g.textBaseline = "top";
    var seen = -1;
    for (var f2 = 0; f2 < HDAYS; f2++) {
      var d2 = frameDate(f2);
      if (d2.getUTCMonth() === seen) continue;
      seen = d2.getUTCMonth();
      var tx = Math.round(xOf(f2)) + 0.5;
      g.beginPath(); g.moveTo(tx, STR_B + 2); g.lineTo(tx, STR_B + 7); g.stroke();
      if (tx < PW - 26) g.fillText(MON[seen].toUpperCase(), tx + 3, AX_Y - 8);
    }

    /* event pins: filled when the event belongs to a selected issue */
    EVENTS.forEach(function (e) {
      var ex = Math.round(xOf(e.d)) + 0.5;
      var on = CHART_STORY >= 0 ? e.si === CHART_STORY
             : CHART_PAPER ? SELP.indexOf(e.si) >= 0 : SEL.indexOf(e.si) >= 0;
      g.strokeStyle = rule; g.lineWidth = 1;
      g.beginPath(); g.moveTo(ex, PIN_Y + 4); g.lineTo(ex, STR_T - 1); g.stroke();
      g.fillStyle = ink3; g.strokeStyle = ink3;
      g.beginPath(); g.arc(ex, PIN_Y, on ? 3.6 : 2.4, 0, Math.PI * 2);
      if (on) g.fill(); else g.stroke();
    });
    findPeaks(SER, yOf, PW);
    drawChips();
    drawTL();
  }

  /* A local maximum is only worth annotating if it stands clear of its own
     surroundings, so a peak has to be the highest point within six days and
     rise at least a fifth above the troughs on either side of it. Where an
     event sits under the peak it supplies the wording; otherwise the peak
     describes itself. */
  var PEAKS = [];
  function findPeaks(SER, yOf, PW) {
    PEAKS = [];
    SER.forEach(function (sr) {
      var i = sr.ev, ser = [], f;
      for (f = 0; f < HDAYS; f++) ser.push(sr.at(f));
      for (f = 3; f < HDAYS - 3; f++) {
        if (!ser[f].live) continue;
        var v = ser[f].v, ok = true, d, g2;
        for (d = -6; d <= 6 && ok; d++) {
          g2 = f + d;
          if (d === 0 || g2 < 0 || g2 >= HDAYS) continue;
          if (ser[g2].v >= v) ok = false;
        }
        if (!ok) continue;
        var loL = v, loR = v;
        for (d = 1; d <= 16; d++) {
          g2 = f - d; if (g2 >= 0 && ser[g2].live) loL = Math.min(loL, ser[g2].v);
          g2 = f + d; if (g2 < HDAYS && ser[g2].live) loR = Math.min(loR, ser[g2].v);
        }
        if (v < Math.max(loL, loR) * 1.20) continue;
        var txt = null;
        for (var k = 0; k < EVENTS.length; k++) {
          if (EVENTS[k].si === i && Math.abs(EVENTS[k].d - f) <= 9) { txt = EVENTS[k].t; break; }
        }
        if (!txt) {
          txt = sr.label + " peaks at " + (v * 100).toFixed(1) +
                (CHART_STORY >= 0 ? "% of this story"
                 : CHART_PAPER ? "% of this paper" : "% of coverage");
        }
        PEAKS.push({ i: i, f: f, x: f / (HDAYS - 1) * (PW - 1), y: yOf(v),
                     col: sr.col, t: txt });
      }
    });
  }

  /* the chips are the legend and the way to drop an issue again */
  function drawChips() {
    var box = document.getElementById("tlChips");
    if (!box) return;
    var SER = seriesNow();
    if (!SER.length) {
      box.innerHTML = '<span class="tl-hint">' + (SELMODE
        ? "Click Any Shape On The Sphere"
        : "Nothing Selected \u2014 Turn On Select Issues") + "</span>";
      return;
    }
    box.innerHTML = SER.map(function (sr, k) {
      var v = CHART_STORY >= 0 ? sr.label : CHART_PAPER ? SELP[k] : SEL[k];
      return '<button class="tl-chip" data-i="' + v +
        '" title="Remove ' + sr.label + ' from the chart" aria-label="Remove ' +
        sr.label + ' from the chart">' +
        '<span class="sw" style="background:' + sr.col + '"></span>' +
        sr.label + '<span class="x" aria-hidden="true">\u00d7</span></button>';
    }).join("");
  }
  function toggleSel(v) {
    if (CHART_PAPER) {
      var kp = SELP.indexOf(v);
      if (kp >= 0) { SELP.splice(kp, 1); delete SLOT["p:" + v]; }
      else {
        SELP.push(v);
        takeSlot("p:" + v, SELP.map(function (q) { return "p:" + q; }));
      }
      buildStream();
      return;
    }
    if (CHART_STORY >= 0) {
      var ko = SELO.indexOf(v);
      if (ko >= 0) SELO.splice(ko, 1);
      else { SELO.push(v); takeSlot("o:" + v, SELO.map(function (q) { return "o:" + q; })); }
    } else {
      var k = SEL.indexOf(v);
      if (k >= 0) { SEL.splice(k, 1); delete SLOT["i:" + v]; }
      else {
        if (SEL.length >= 6) { delete SLOT["i:" + SEL[0]]; SEL.shift(); }
        SEL.push(v); takeSlot("i:" + v, SEL.map(function (q) { return "i:" + q; }));
      }
    }
    buildStream();
  }

  function nearestEvent(x, within) {
    var best = -1, bd = 1e9;
    EVENTS.forEach(function (e, k) {
      var d = Math.abs(xOf(e.d) - x);
      if (d < bd) { bd = d; best = k; }
    });
    return bd <= (within == null ? 7 : within) ? best : -1;
  }

  function drawTL() {
    if (!tctx || !TLW) return;
    tctx.setTransform(TLDPR, 0, 0, TLDPR, 0, 0);
    tctx.clearRect(0, 0, TLW, TLH);
    tctx.drawImage(tlOff, 0, 0, TLW, TLH);
    var cs = getComputedStyle(document.documentElement);
    var ink = cs.getPropertyValue("--ink").trim();
    var px = Math.round(xOf(pos)) + 0.5;
    tctx.strokeStyle = ink; tctx.lineWidth = 1;
    tctx.beginPath(); tctx.moveTo(px, PIN_Y - 6); tctx.lineTo(px, STR_B + 8); tctx.stroke();
    tctx.fillStyle = ink;
    tctx.beginPath();
    tctx.moveTo(px - 4, PIN_Y - 10); tctx.lineTo(px + 4, PIN_Y - 10); tctx.lineTo(px, PIN_Y - 4);
    tctx.closePath(); tctx.fill();
    /* an event the playhead is sitting on gets a filled pin */
    EVENTS.forEach(function (e) {
      if (Math.abs(e.d - pos) > 1.6) return;
      var ex = Math.round(xOf(e.d)) + 0.5;
      tctx.fillStyle = ink;
      tctx.beginPath(); tctx.arc(ex, PIN_Y, 4, 0, Math.PI * 2); tctx.fill();
    });
    /* peak callouts, fading in as the playhead reaches them */
    var near = PEAKS.filter(function (pk) { return Math.abs(pk.f - pos) < 7; })
                    .sort(function (a, b) { return a.y - b.y; });
    var taken = [];
    tctx.font = '10.5px ' + (getComputedStyle(document.documentElement)
      .getPropertyValue("--f-head").trim() || "sans-serif");
    tctx.textBaseline = "middle";
    var paper = cs.getPropertyValue("--surface").trim() || "#fff";
    near.forEach(function (pk) {
      var a = 1 - Math.abs(pk.f - pos) / 7;
      a = clamp(a * 1.6, 0, 1);
      var w = tctx.measureText(pk.t).width + 12;
      var lx = clamp(pk.x - w / 2, 2, Math.max(2, plotW() - w - 2));
      var ly = pk.y - 16;
      for (var q = 0; q < taken.length; q++) {
        if (Math.abs(taken[q][1] - ly) < 15 && lx < taken[q][0] + taken[q][2] && taken[q][0] < lx + w) {
          ly = taken[q][1] - 16; q = -1;
        }
      }
      ly = clamp(ly, STR_T + 8, STR_B - 6);
      taken.push([lx, ly, w]);
      tctx.globalAlpha = a;
      tctx.strokeStyle = pk.col; tctx.lineWidth = 1;
      tctx.beginPath(); tctx.moveTo(pk.x, pk.y - 4); tctx.lineTo(pk.x, ly + 8); tctx.stroke();
      tctx.fillStyle = paper;
      tctx.fillRect(lx, ly - 8, w, 16);
      tctx.strokeStyle = pk.col;
      tctx.strokeRect(lx + 0.5, ly - 7.5, w - 1, 15);
      tctx.fillStyle = pk.col;
      tctx.textAlign = "left";
      tctx.fillText(pk.t, lx + 6, ly);
      tctx.beginPath(); tctx.arc(pk.x, pk.y, 3, 0, Math.PI * 2); tctx.fill();
      tctx.globalAlpha = 1;
    });
    if (tlDate) tlDate.textContent = fmtDate(Math.round(pos)) +
      (FPM.GAPS[Math.round(pos)] ? " \u00b7 not collected" : "");
  }

  function setCap(k, hover) {
    if (!tlCap) return;
    if (k < 0) {
      tlCap.innerHTML = SELMODE
        ? "<i>Select mode is on: clicking a shape adds or removes it from the chart "
          + "instead of opening it. Turn it off to go back to drilling down.</i>"
        : "<i>Drag the strip to scrub; pins mark the events that moved the numbers.</i>";
      return;
    }
    var e = EVENTS[k];
    tlCap.innerHTML = "<b>" + fmtDate(e.d) + "</b> &middot; " + e.t +
      ' <i>&mdash; ' + ST[e.si][1] + (hover ? "" : "") + "</i>";
  }

  /* ---------- driving the globe ---------- */
  var PLAYING = false, lastPos = -99, rafId = 0, lastT = 0;
  var SPEED = 0.5;                            /* days of history per second */
  var FRAME_MS = [];

  function paintStory(cold) {
    var c = cur();
    var cssW = stage.getBoundingClientRect().width;
    if (!cssW) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = clamp(Math.round(cssW * dpr * PAINTQ), 320, 980);
    cv.width = W; cv.height = W; R = W * 0.487; C = W / 2;
    var pal = palette();
    var outs = outletsOf(c.idx);
    var items = outs.map(function (o) {
      return { ang: Math.atan2(o.y, o.x), rankKey: Math.abs(o.stance), area: o.sal };
    });
    c.layout = (cold || !c.layout) ? layout(items, 0.06)
                                   : relayout(c.layout, items, 80, 10, 16);
    c.res = renderDisc(W, c.layout, outs.map(function (o) {
      var col = toneOf(pal.stops, o.stance); return [col, col];
    }), pal, cssW);
    c.items = outs;
    c.names = outs.map(function (o) { return o.name; });
    c.shorts = c.names;
    c.values = outs.map(function (o) { return (o.stance > 0 ? "+" : "") + o.stance.toFixed(1); });
    ctx.clearRect(0, 0, W, W);
    ctx.drawImage(c.res.canvas, 0, 0);
    labelLevel(c);
  }

  /* a paper's globe moves under playback the same way the others do */
  function paintPaper(cold) {
    var c = cur();
    var cssW = stage.getBoundingClientRect().width;
    if (!cssW) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = clamp(Math.round(cssW * dpr * PAINTQ), 320, 980);
    cv.width = W; cv.height = W; R = W * 0.487; C = W / 2;
    var next = paperLevel(c.outlet, palette(), c.fromStory, c, cold);
    if (!next) return;
    next.ring = c.ring; next.ringC = c.ringC; next.flat = c.flat;
    levels[levels.length - 1] = next;
    ctx.clearRect(0, 0, W, W);
    ctx.drawImage(next.res.canvas, 0, 0);
    labelLevel(next);
  }

  function setPos(np, cold) {
    pos = clamp(np, 0, HDAYS - 1);
    setTFX(pos);
    var t0 = performance.now();
    var jump = Math.abs(pos - lastPos);
    var lvl = cur();
    PAINTQ = PLAYING ? 0.62 : 1;
    if (lvl.kind === "story" && mode === "ready") {
      paintStory(cold || jump > 6);
    } else if (lvl.kind === "paper" && mode === "ready") {
      paintPaper(cold || jump > 6);
    } else if (lvl.kind === "outlet") {
      /* headlines are discrete items, not a quantity that flows - the strip
         still moves, but the level itself is left alone */
    } else {
      var ids = liveIds(), items = playItems(ids);
      if (cold || jump > 6 || !globeL || !globeL.ids) {
        globeL = layout(items); globeL.ids = ids;
      } else globeL = relayout(globeL, items, 96, 12, 20, ids);
      paint();
    }
    lastPos = pos;
    FRAME_MS.push(performance.now() - t0);
    if (FRAME_MS.length > 60) FRAME_MS.shift();
    drawTL();
    /* flag an event as the playhead passes it */
    var k = -1;
    for (var q = 0; q < EVENTS.length; q++) {
      if (Math.abs(EVENTS[q].d - pos) < 2.2) { k = q; break; }
    }
    if (k >= 0 && k !== capEv) { capEv = k; capUntil = performance.now() + 3500; setCap(k); }
    else if (k < 0 && capEv >= 0 && performance.now() > capUntil) { capEv = -1; setCap(-1); }
  }

  function tick(now) {
    if (!PLAYING) return;
    if (!lastT) lastT = now;
    var dt = Math.min(0.4, (now - lastT) / 1000);
    lastT = now;
    var np = pos + dt * SPEED;
    if (np >= HDAYS - 1) { setPos(HDAYS - 1); stopPlay(); return; }
    setPos(np);
    rafId = requestAnimationFrame(tick);
  }
  function startPlay() {
    if (PLAYING || mode !== "ready") return;
    if (pos >= HDAYS - 1.001) { setPos(0, true); }
    PLAYING = true; lastT = 0;
    resetLabelDamping();
    var b = document.getElementById("tlPlay");
    if (b) { b.textContent = "Pause"; b.setAttribute("data-on", "1"); }
    rafId = requestAnimationFrame(tick);
  }
  function stopPlay() {
    if (!PLAYING) return;
    PLAYING = false;
    resetLabelDamping();
    cancelAnimationFrame(rafId);
    var b = document.getElementById("tlPlay");
    if (b) { b.textContent = "Play"; b.setAttribute("data-on", "0"); }
    PAINTQ = 1;
    if (cur().kind === "story") paintStory(false);
    else if (cur().kind === "paper") paintPaper(false);
    else if (cur().kind === "globe") paint();    /* full resolution once stopped */
    drawTL();
  }

  if (tlc) {
    var dragging = false;
    var seek = function (e) {
      var r = tlc.getBoundingClientRect();
      setPos(fOf((e.touches ? e.touches[0].clientX : e.clientX) - r.left));
    };
    tlc.addEventListener("mousedown", function (e) {
      stopPlay(); dragging = true; seek(e); e.preventDefault();
    });
    window.addEventListener("mousemove", function (e) { if (dragging) seek(e); });
    window.addEventListener("mouseup", function () {
      if (!dragging) return;
      dragging = false;
      PAINTQ = 1;
      if (cur().kind === "story") paintStory(false);
      else if (cur().kind === "paper") paintPaper(false);
      else if (cur().kind === "globe") paint();
    });
    tlc.addEventListener("mousemove", function (e) {
      if (dragging) return;
      var r = tlc.getBoundingClientRect();
      var k = nearestEvent(e.clientX - r.left);
      tlc.style.cursor = k >= 0 ? "pointer" : "ew-resize";
      if (k >= 0) setCap(k, true);
      else if (capEv < 0) setCap(-1);
    });
    tlc.addEventListener("click", function (e) {
      var r = tlc.getBoundingClientRect();
      var k = nearestEvent(e.clientX - r.left);
      if (k >= 0) { stopPlay(); setPos(EVENTS[k].d); capEv = k; setCap(k); }
    });
    tlc.addEventListener("touchstart", function (e) { stopPlay(); seek(e); }, { passive: true });
    tlc.addEventListener("touchmove", function (e) { seek(e); }, { passive: true });
  }

  (function wireSelect() {
    var b = document.getElementById("tlSelect");
    if (!b) return;
    b.addEventListener("click", function () {
      SELMODE = !SELMODE;
      b.setAttribute("data-on", SELMODE ? "1" : "0");
      stage.setAttribute("data-pick", SELMODE ? "1" : "0");

      drawChips();
      if (tlCap) {
        tlCap.innerHTML = SELMODE
          ? "<i>Select mode is on: clicking a shape adds or removes it from the chart "
            + "instead of opening it. Turn it off to go back to drilling down.</i>"
          : "<i>Drag the strip to scrub; pins mark the events that moved the numbers.</i>";
      }
    });
  })();

  (function wireChips() {
    var box = document.getElementById("tlChips");
    if (!box) return;
    box.addEventListener("click", function (e) {
      var b = e.target.closest(".tl-chip");
      if (!b) return;
      var raw = b.getAttribute("data-i");
      toggleSel(CHART_STORY >= 0 ? raw : parseInt(raw, 10));
      if (mode === "ready") labelLevel(cur());
      if (cur().kind === "globe" && mode === "ready") labelLevel(cur());
    });
  })();

  (function wireTL() {
    var pb = document.getElementById("tlPlay");
    if (pb) pb.addEventListener("click", function () { PLAYING ? stopPlay() : startPlay(); });
    var nx = document.getElementById("tlNext");
    if (nx) nx.addEventListener("click", function () {
      stopPlay();
      for (var i = 0; i < EVENTS.length; i++) {
        if (EVENTS[i].d > pos + 0.5) { setPos(EVENTS[i].d); capEv = i; setCap(i); return; }
      }
    });
    var pv = document.getElementById("tlPrev");
    if (pv) pv.addEventListener("click", function () {
      stopPlay();
      for (var i = EVENTS.length - 1; i >= 0; i--) {
        if (EVENTS[i].d < pos - 0.5) { setPos(EVENTS[i].d); capEv = i; setCap(i); return; }
      }
    });
    var nw = document.getElementById("tlNow");
    if (nw) nw.addEventListener("click", function () {
      stopPlay(); TFX = null; TPOS = HDAYS - 1; lastPos = -99; pos = HDAYS - 1;
      capEv = -1; setCap(-1);
      PAINTQ = 1;
      if (cur().kind === "globe") { buildGlobe(); paint(); }
      else if (cur().kind === "paper") paintPaper(true);
      else if (cur().kind === "story") paintStory(true);
      drawTL();
    });
    var sp = document.getElementById("segSpeed");
    if (sp) sp.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      Array.prototype.slice.call(sp.querySelectorAll("button")).forEach(function (o) {
        o.setAttribute("aria-pressed", o === b ? "true" : "false");
      });
      SPEED = parseFloat(b.getAttribute("data-v"));
    });
    setCap(-1);
  })();

  window.__liveSeries = function (which) {
    if (which != null) {
      var days = 0, gaps = 0, was = false;
      for (var f2 = 0; f2 < HDAYS; f2++) {
        var t2 = 0, q;
        for (q = 0; q < N; q++) t2 += HIST.share[f2 * N + q];
        var on = HIST.share[f2 * N + which] / t2 > LIVE_MIN;
        if (on) days++; else if (was) gaps++;
        was = on;
      }
      return { issue: ST[which][1], liveDays: days, offDays: HDAYS - days, spells: gaps + (was ? 1 : 0) };
    }
    var out = [];
    for (var f = 0; f < HDAYS; f++) {
      var tot = 0, k;
      for (k = 0; k < N; k++) tot += HIST.share[f * N + k];
      var c = 0;
      for (k = 0; k < N; k++) if (HIST.share[f * N + k] / tot > LIVE_MIN) c++;
      out.push(c);
    }
    return out;
  };

  window.__dampStats = function () { return { snaps: LDAMP_SNAP }; };

  window.__pbStats = function () {
    var a = FRAME_MS.slice().sort(function (x, y) { return x - y; });
    if (!a.length) return { frames: 0 };
    return { frames: a.length, medMs: +a[a.length >> 1].toFixed(1),
             p95Ms: +a[Math.min(a.length - 1, Math.floor(a.length * 0.95))].toFixed(1),
             maxMs: +a[a.length - 1].toFixed(1), fps: +(1000 / a[a.length >> 1]).toFixed(1) };
  };

  /* ---------- the press map ---------- */
  (function pressMap() {
    var svg = document.querySelector(".pressmap");
    if (!svg) return;
    var P = function (v) { return 125 + v * 98; }, Q = function (v) { return 125 - v * 98; };
    var o = [
      '<line x1="18" y1="125" x2="232" y2="125" stroke="var(--rule)" stroke-width="1"/>',
      '<line x1="125" y1="18" x2="125" y2="232" stroke="var(--rule)" stroke-width="1"/>',
      '<circle cx="125" cy="125" r="99" fill="none" stroke="var(--rule-soft)" stroke-width="1"/>'
    ];
    var ax = 'font-family="IBM Plex Mono, monospace" font-size="8" letter-spacing="1" fill="var(--ink-3)"';
    o.push('<text x="125" y="12" text-anchor="middle" ' + ax + ">BROADSHEET</text>");
    o.push('<text x="125" y="244" text-anchor="middle" ' + ax + ">POPULAR</text>");
    o.push('<text x="2" y="122" ' + ax + ">LEFT</text>");
    o.push('<text x="248" y="122" text-anchor="end" ' + ax + ">RIGHT</text>");
    var named = { Guardian: [-30, -9], Mirror: [-6, 15], BBC: [-24, -9], FT: [10, -8], Telegraph: [8, 5], Mail: [9, 4], Sun: [8, 10] };
    Object.keys(PRESS).forEach(function (n) {
      var p = PRESS[n];
      o.push('<circle cx="' + P(p[0]).toFixed(1) + '" cy="' + Q(p[1]).toFixed(1) + '" r="3.4" fill="var(--teal)" opacity="0.85"/>');
      if (named[n]) {
        o.push('<text x="' + (P(p[0]) + named[n][0]).toFixed(1) + '" y="' + (Q(p[1]) + named[n][1]).toFixed(1) +
          '" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="var(--ink-2)">' + n + "</text>");
      }
    });
    svg.innerHTML = o.join("");
  })();

  /* ---------- lifecycle ---------- */
  buildGlobe();
  paint();
  buildStream();
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var nw = clamp(Math.round(stage.getBoundingClientRect().width * Math.min(window.devicePixelRatio || 1, 2)), 320, 980);
      if (Math.abs(nw - W) > 8) paint();
      buildStream();
    }, 200);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", paint);
  }
  new MutationObserver(function () { paint(); buildStream(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () {
    if (levels.length <= 1) paint();
  });
})();
</script>
