<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Page Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Archivo:wdth,wght@75..112,400..800&family=Newsreader:opsz,wght@6..72,300..600&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@500&family=Inter+Tight:wght@500&family=IBM+Plex+Sans:wght@500&family=Source+Sans+3:wght@500&family=Public+Sans:wght@500&family=Manrope:wght@500&family=DM+Sans:wght@500&family=Work+Sans:wght@500&family=Outfit:wght@500&family=Rubik:wght@500&family=Karla:wght@500&family=Mulish:wght@500&family=Lexend:wght@500&family=Hanken+Grotesk:wght@500&family=Instrument+Sans:wght@500&family=Familjen+Grotesk:wght@500&family=Onest:wght@500&family=Chivo:wght@500&family=Jost:wght@500&family=Epilogue:wght@500&family=Barlow+Semi+Condensed:wght@500&family=Asap+Condensed:wght@500&family=Encode+Sans+Semi+Condensed:wght@500&family=Roboto+Condensed:wght@500&family=Source+Serif+4:wght@500&family=Literata:wght@500&family=Lora:wght@500&family=Spectral:wght@500&family=Merriweather:wght@500&family=PT+Serif:wght@500&family=Crimson+Pro:wght@500&family=Frank+Ruhl+Libre:wght@500&family=Petrona:wght@500&family=Faustina:wght@500&family=Zilla+Slab:wght@500&family=Bitter:wght@500&family=Noto+Serif:wght@500&family=Libre+Baskerville:wght@500&display=swap">

<style>
  :root {
    color-scheme: light;
    --page:      #eef1f0;
    --surface:   #fbfcfb;
    --sunk:      #e5eae8;
    --ink:       #101615;
    --ink-2:     #4b5654;
    --ink-3:     #7c8785;
    --rule:      #d8dedc;
    --rule-soft: #e6eae9;
    --teal:      #0d6f5d;
    --amber:     #b8541c;

    /* diverging sentiment scale: amber (negative) <-> neutral <-> teal (positive) */
    --s-neg2: #a8481a;
    --s-neg1: #dd9060;
    --s-zero: #e2e5e3;
    --s-pos1: #6dc0a6;
    --s-pos2: #0d6f5d;
    --s-none: #eef1f0;

    /* sphere &mdash; Signal, red to green (settled). Gutters take the paper colour,
       so the shapes read as ink printed onto the figure's own surface. */
    --sph-n2: #e01e1e;
    --sph-n1: #f56464;
    --sph-z:  #e6e2d4;
    --sph-p1: #52c97a;
    --sph-p2: #0f8f42;
    --f-head: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;

    /* series colours for the comparison chart: identity, not stance - on a
       chart of several issues telling the lines apart matters more than
       carrying the red-to-green scale across, which the sphere still holds */
    --ser-0: #2f6fd0;
    --ser-1: #d9642a;
    --ser-2: #128a6e;
    --ser-3: #8b3fc0;
    --ser-4: #c8306c;
    --ser-5: #94781a;
    --ser-6: #1f8fb0;
    --ser-7: #b8452f;
    --ser-8: #5b7a1e;
    --ser-9: #7a5bd0;
    --ser-10: #b4297f;
    --ser-11: #3f6a86;
    --ser-12: #a8571d;
    --ser-13: #2b8f52;
    --sph-paper:  #fbfcfb;
    --sph-lit:    #fffdf6;
    --sph-shadow: #3a362a;

    --shadow: 0 1px 2px rgba(16,22,21,.05), 0 8px 24px -14px rgba(16,22,21,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:      #0a0e0d;
      --surface:   #131817;
      --sunk:      #1b201f;
      --ink:       #edf2f0;
      --ink-2:     #a3aeab;
      --ink-3:     #79837f;
      --rule:      #262d2b;
      --rule-soft: #1d2422;
      --teal:      #46c2a2;
      --amber:     #e08249;

      --s-neg2: #e08249;
      --s-neg1: #8a5232;
      --s-zero: #2c3331;
      --s-pos1: #2d6a5a;
      --s-pos2: #4fcaa9;
      --s-none: #171d1b;

      --ser-0: #6aa6f5;
      --ser-1: #f79a5c;
      --ser-2: #45c9a6;
      --ser-3: #c08cf0;
      --ser-4: #f56a9c;
      --ser-5: #d4b74a;
      --ser-6: #5fc4e4;
      --ser-7: #f08a72;
      --ser-8: #a5cc5a;
      --ser-9: #a898f0;
      --ser-10: #f078bc;
      --ser-11: #86aec8;
      --ser-12: #f0a45e;
      --ser-13: #62d68d;
      --sph-n2: #ff4d4d;
      --sph-n1: #c22e2e;
      --sph-z:  #4a4a42;
      --sph-p1: #2fa86a;
      --sph-p2: #5ef0a0;
      --sph-paper:  #131817;
      --sph-lit:    #6e7060;
      --sph-shadow: #050603;

      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0a0e0d;
    --surface:   #131817;
    --sunk:      #1b201f;
    --ink:       #edf2f0;
    --ink-2:     #a3aeab;
    --ink-3:     #79837f;
    --rule:      #262d2b;
    --rule-soft: #1d2422;
    --teal:      #46c2a2;
    --amber:     #e08249;

    --s-neg2: #e08249;
    --s-neg1: #8a5232;
    --s-zero: #2c3331;
    --s-pos1: #2d6a5a;
    --s-pos2: #4fcaa9;
    --s-none: #171d1b;

    --ser-0: #6aa6f5;
    --ser-1: #f79a5c;
    --ser-2: #45c9a6;
    --ser-3: #c08cf0;
    --ser-4: #f56a9c;
    --ser-5: #d4b74a;
    --ser-6: #5fc4e4;
    --ser-7: #f08a72;
    --ser-8: #a5cc5a;
    --ser-9: #a898f0;
    --ser-10: #f078bc;
    --ser-11: #86aec8;
    --ser-12: #f0a45e;
    --ser-13: #62d68d;

    --sph-n2: #ff4d4d;
    --sph-n1: #c22e2e;
    --sph-z:  #4a4a42;
    --sph-p1: #2fa86a;
    --sph-p2: #5ef0a0;
    --sph-paper:  #131817;
    --sph-lit:    #6e7060;
    --sph-shadow: #050603;

    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-size: 17.5px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 96px;
  }

  /* ---------- masthead ---------- */

  .masthead {
    border-bottom: 2px solid var(--ink);
    padding: 56px 0 22px;
    margin-bottom: 12px;
  }
  .dateline {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    margin-bottom: 22px;
  }
  h1 {
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-variation-settings: "wdth" 84;
    font-weight: 800;
    font-size: clamp(46px, 9.5vw, 88px);
    line-height: .94;
    letter-spacing: -.022em;
    margin: 0 0 18px;
    text-wrap: balance;
  }
  .standfirst {
    font-size: clamp(19px, 2.4vw, 23px);
    line-height: 1.46;
    color: var(--ink-2);
    max-width: 34em;
    margin: 0;
  }
  .standfirst strong { color: var(--ink); font-weight: 600; }

  .meta-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
    gap: 1px;
    background: var(--rule);
    border-bottom: 1px solid var(--rule);
    margin-bottom: 64px;
  }
  .meta-strip div {
    background: var(--page);
    padding: 14px 0 16px;
  }
  .meta-strip dt {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 4px;
  }
  .meta-strip dd {
    margin: 0;
    font-family: "Archivo", Arial, sans-serif;
    font-variation-settings: "wdth" 92;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
  }

  /* ---------- sections ---------- */

  section { margin-bottom: 76px; }

  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    border-top: 1px solid var(--ink);
    padding-top: 10px;
    margin-bottom: 26px;
  }
  .sec-head .tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--teal);
    white-space: nowrap;
    padding-top: 5px;
  }
  h2 {
    font-family: "Archivo", Arial, sans-serif;
    font-variation-settings: "wdth" 82;
    font-weight: 700;
    font-size: clamp(28px, 4.4vw, 40px);
    line-height: 1.02;
    letter-spacing: -.014em;
    margin: 0;
    text-wrap: balance;
  }

  h3 {
    font-family: "Archivo", Arial, sans-serif;
    font-variation-settings: "wdth" 95;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -.002em;
    margin: 34px 0 8px;
    color: var(--ink);
  }

  .col { max-width: 39em; }
  .col p { margin: 0 0 17px; }
  .col > :last-child { margin-bottom: 0; }

  a { color: var(--teal); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 3px;
  }

  code, .mono {
    font-family: "IBM Plex Mono", monospace;
    font-size: .84em;
  }
  code {
    background: var(--sunk);
    padding: .1em .38em;
    border-radius: 3px;
  }

  ul.tight { margin: 0 0 17px; padding-left: 1.15em; }
  ul.tight li { margin-bottom: 7px; }
  ul.tight li::marker { color: var(--ink-3); }

  .lede-note {
    border-left: 2px solid var(--amber);
    padding: 2px 0 2px 16px;
    margin: 24px 0;
    color: var(--ink-2);
    font-size: 16.5px;
    max-width: 38em;
  }

  /* ---------- figures ---------- */

  figure {
    margin: 34px 0 8px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .fig-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .fig-title {
    font-family: "Archivo", Arial, sans-serif;
    font-variation-settings: "wdth" 95;
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: .002em;
  }
  .badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--amber);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 3px 9px 2px;
    white-space: nowrap;
  }
  .fig-body { padding: 20px; overflow-x: auto; }
  figcaption {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink-2);
    padding: 0 20px 18px;
    max-width: 46em;
  }
  figure svg { display: block; }

  /* ---------- sphere ---------- */

  .hero { margin-bottom: 84px; }
  .hero figure { margin-top: 26px; }

  .sphere-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(232px, 0.95fr);
    gap: 30px 38px;
    align-items: start;
    padding: 26px 24px 30px;
  }
  @media (max-width: 780px) {
    .sphere-layout { grid-template-columns: 1fr; padding: 18px 16px 24px; }
  }

  .sphere-stage {
    position: relative;
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    aspect-ratio: 1;
  }
  .sphere-stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  .sphere-glow {
    position: absolute;
    inset: 3%;
    border-radius: 50%;
    box-shadow: 0 26px 60px -28px rgba(0,0,0,.55);
    pointer-events: none;
  }

  .lbl, .meas {
    position: absolute;
    text-align: center;
    font-family: "Figtree", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    line-height: .95;
    letter-spacing: .004em;
    text-transform: capitalize;
  }
  .lbl { transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity .2s ease; }
  /* level three labels are whole headlines: sentence case, lighter and smaller,
     with real leading - display weight is wrong for running headline text */
  .sphere-stage[data-level="outlet"] .lbl,
  .sphere-stage[data-level="outlet"] .meas {
    font-family: var(--f-head);
    text-transform: none;
    font-weight: 500;
    line-height: 1.18;
    letter-spacing: .002em;
  }
  .sphere-stage[data-level="outlet"] .lbl em,
  .sphere-stage[data-level="outlet"] .meas em { font-size: .74em; margin-top: 4px; }
  .lbl.val,
  .sphere-stage[data-level="outlet"] .lbl.val {
    font-family: "IBM Plex Mono", monospace; font-weight: 700; opacity: 1;
  }
  .meas { visibility: hidden; left: -9999px; top: 0; white-space: normal; }
  @media (prefers-reduced-motion: reduce) { .lbl { transition: none; } }
  .lbl em, .meas em {
    display: block;
    font-style: normal;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: .68em;
    letter-spacing: .02em;
    opacity: .9;
    margin-top: 3px;
    text-transform: none;
  }

  .sphere-tip {
    position: absolute;
    z-index: 4;
    pointer-events: none;
    min-width: 168px;
    max-width: 230px;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 45%, transparent);
    -webkit-backdrop-filter: blur(17px) saturate(1.6);
    backdrop-filter: blur(17px) saturate(1.6);
    border: 1px solid color-mix(in srgb, var(--rule) 42%, transparent);
    border-radius: 3px;
    box-shadow: 0 4px 22px -6px rgba(0,0,0,.32);
    padding: 11px 13px 12px;
    transform: translate(-50%, calc(-100% - 14px));
    opacity: 0;
    transition: opacity .1s ease;
  }
  .sphere-tip[data-on="1"] { opacity: 1; }
  .sphere-tip .t-name {
    font-family: "Archivo", Arial, sans-serif;
    font-variation-settings: "wdth" 92;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.16;
    margin-bottom: 7px;
  }
  .sphere-tip dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .04em;
  }
  .sphere-tip dt { color: var(--ink-3); text-transform: uppercase; }
  .sphere-tip dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sphere-tip .t-outlets {
    margin: 9px 0 0;
    padding-top: 8px;
    border-top: 1px solid var(--rule-soft);
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-2);
  }

  /* key panel */
  .key { display: grid; }
  .key-stack { display: grid; gap: 22px; align-content: start; }
  /* display:grid above outranks the UA's [hidden] rule, so say it explicitly &mdash;
     otherwise both key panels show at once wherever the host page has no reset */
  .key-stack[hidden] { display: none; }

  .back-btn {
    position: absolute;
    z-index: 5;
    top: 2px; left: 2px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: color-mix(in srgb, var(--surface) 45%, transparent);
    -webkit-backdrop-filter: blur(17px) saturate(1.6);
    backdrop-filter: blur(17px) saturate(1.6);
    border: 1px solid color-mix(in srgb, var(--rule) 42%, transparent);
    border-radius: 3px;
    padding: 7px 11px 6px;
    cursor: pointer;
    box-shadow: 0 2px 10px -4px rgba(0,0,0,.35);
  }
  .back-btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .back-btn.right { left: auto; right: 2px; }
  .back-btn.right[data-on="1"] { color: var(--page); background: var(--ink); border-color: var(--ink); }

  /* detail key panel */
  .kd-head { border-bottom: 1px solid var(--rule); padding-bottom: 14px; }
  .kd-eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 6px;
  }
  .kd-head h3 {
    margin: 0 0 9px;
    font-size: 21px;
    font-variation-settings: "wdth" 86;
    line-height: 1.06;
  }
  .kd-stats {
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .kd-table { width: 100%; min-width: 0; border-collapse: collapse; font-size: 12.5px; margin-top: 2px; }
  .kd-table th {
    font-size: 9px; letter-spacing: .12em; padding: 0 8px 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .kd-table td {
    padding: 5px 8px 5px 0;
    border-bottom: 1px solid var(--rule-soft);
    font-size: 12.5px;
  }
  .kd-table td:first-child {
    font-family: "Archivo", Arial, sans-serif;
    font-variation-settings: "wdth" 88;
    font-weight: 600; font-size: 12.5px; color: var(--ink);
  }
  .kd-table td.bar { width: 46%; padding-right: 10px; }
  .kd-table td.bar span {
    display: block; height: 7px; border-radius: 2px;
    background: var(--teal); opacity: .55; min-width: 3px;
  }
  .kd-table td.num {
    text-align: right; font-family: "IBM Plex Mono", monospace;
    font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-2);
  }
  .kd-table th.num { text-align: right; }
  .key-item .k-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin-bottom: 7px;
  }
  .key-item .k-n {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--teal);
  }
  .key-item .k-t {
    font-family: "Archivo", Arial, sans-serif;
    font-variation-settings: "wdth" 92;
    font-weight: 700;
    font-size: 14px;
  }
  .key-item p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.45;
    color: var(--ink-2);
  }
  .key-item p b {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
    margin-right: 4px;
  }
  .key-ramp { display: flex; align-items: center; gap: 8px; margin: 9px 0 8px; }
  .key-ramp .bar {
    flex: 1;
    height: 12px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--sph-n2), var(--sph-n1), var(--sph-z), var(--sph-p1), var(--sph-p2));
  }
  .key-ramp span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .pressmap { width: 100%; height: auto; margin: 10px 0 6px; display: block; }

  .headfont { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule-soft); }

  /* ---------- playback timeline ---------- */
  .tl { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .tl-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .tl-canvas { display: block; width: 100%; cursor: ew-resize; touch-action: none; }
  .tl-cap {
    font-size: 11.5px; line-height: 1.4; color: var(--ink-2);
    min-height: 32px; margin: 7px 0 0; padding-left: 1px;
  }
  .tl-cap b { font-weight: 600; color: var(--ink); }
  .tl-cap i { font-style: normal; color: var(--ink-3); }
  .tl-ctl { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin-top: 8px; }
  .tl-grp { display: flex; align-items: center; gap: 8px; }
  .tl-btn {

<script>
/* ============================================================
   REAL DATA  -  app/history.js, written by frames/history.py

   The globe below was built on synthetic data. Everything it used to invent
   is supplied here from what the papers actually published: the story list,
   each paper's share of each story day by day, each paper's scored stance,
   the headlines behind them, and the timeline's events. The drawing code is
   unchanged, so everything settled about how it looks and behaves still holds.
   ============================================================ */
var FPM = (function (raw) {
  if (!raw || !raw.stories || !raw.stories.length) {
    document.body.insertAdjacentHTML("afterbegin",
      '<p style="padding:16px">No data yet - app/history.js is missing or empty.</p>');
    return null;
  }
  var D = raw.days.length, S = raw.stories, N = S.length;
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  /* Text from the feeds is drawn as HTML in places, so anything that could be
     markup comes out, and an ampersand becomes a word - it is shown both as
     text and as HTML, and "and" reads right in either. */
  function clean(t) { return String(t == null ? "" : t).replace(/[<>]/g, "").replace(/&/g, "and"); }
  function sum(a) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i]; return t; }
  function lastOf(a) { for (var i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; }
  function at(a, f) {
    f = Math.max(0, Math.min(D - 1, f));
    var f0 = Math.floor(f), f1 = Math.min(D - 1, f0 + 1), u = f - f0;
    var x = a[f0], y = a[f1];
    if (x == null) return y;
    if (y == null) return x;
    return x * (1 - u) + y * u;
  }
  /* The label for a small shape: the first word, or two if the first is short */
  function shortOf(name) {
    var w = name.split(/\s+/);
    return (w[0].length < 4 && w[1]) ? w[0] + " " + w[1] : w[0];
  }

  var ST = [], SHORT = [], TARGET = [], REAL = {}, byId = {};
  S.forEach(function (s, i) {
    byId[s.id] = i;
    var outs = Object.keys(s.outlets).sort(function (a, b) {
      return sum(s.outlets[b].vol) - sum(s.outlets[a].vol);
    });
    var now = lastOf(s.stance);
    var name = clean(s.name);
    /* short, full, volume today, stance today, papers, (unused), (unused) */
    ST.push([name, name, s.vol[D - 1], now == null ? 0 : now, outs, 0, 0]);
    SHORT.push(shortOf(name));
    TARGET.push(clean(s.target));
    outs.forEach(function (o) {
      var hs = s.heads[o] || [];
      if (!hs.length) return;
      REAL[i + "|" + o] = {
        fetched: raw.days[D - 1],
        note: "",
        items: hs.map(function (h) {
          return {
            name: clean(h.t), stand: "", desk: h.k, prom: h.p, d: h.d,
            stance: h.s == null ? 0 : h.s, conf: h.c || "",
            why: h.s == null ? "Not scored yet." : clean(h.r || ""),
            url: String(h.u || "").replace(/"/g, "%22")
          };
        })
      };
    });
  });

  /* history: share and stance per story per day, the layout the timeline
     already reads (frame-major, story-minor) */
  var share = new Float64Array(D * N), dst = new Float64Array(D * N);
  S.forEach(function (s, i) {
    var base = ST[i][3], last = base;
    for (var f = 0; f < D; f++) {
      share[f * N + i] = s.vol[f];
      if (s.stance[f] != null) last = s.stance[f];
      dst[f * N + i] = (s.stance[f] == null ? base : last) - base;
    }
  });

  var EVENTS = raw.events.filter(function (e) { return byId[e.id] != null; })
    .map(function (e) { return { d: e.d, si: byId[e.id], t: clean(e.t) }; });

  function osal(si, o, f) {
    var q = S[si].outlets[o];
    return q ? Math.max(0, at(q.vol, f) || 0) : 0;
  }
  function ostance(si, o, f) {
    var q = S[si].outlets[o], v = q ? at(q.stance, f) : null;
    if (v == null) v = at(S[si].stance, f);
    return v == null ? 0 : v;
  }

  var p = raw.days[D - 1].split("-");
  var first = raw.days[0].split("-");
  function nice(d) { return +d[2] + " " + MON[+d[1] - 1]; }
  var range = nice(first) + " – " + nice(p) + " " + p[0];
  document.addEventListener("DOMContentLoaded", function () {
    var set = function (id, t) { var el = document.getElementById(id); if (el) el.textContent = t; };
    set("fpmDates", range);
    set("fpmPapers", raw.outlets.length + " papers");
    set("fpmRange", "The UK national press · " + range);
    set("fpmBadge", "Real coverage · " + N + " stories");
    set("tlNote", "Compare Stories Over " + D + " Days · Real Coverage");

    outs.forEach(function (o) {
      var w = o.sal;
      sw += w; sx += w*o.x; sy += w*o.stance;
      sxx += w*o.x*o.x; sxy += w*o.x*o.stance;
      if (o.x < xmin) xmin = o.x;
      if (o.x > xmax) xmax = o.x;
    });
    var mean = sy / sw;
    var den = sw*sxx - sx*sx;
    var b = Math.abs(den) < 1e-9 ? 0 : (sw*sxy - sx*sy) / den;
    var a = (sy - b*sx) / sw;
    var lo = clamp(a + b*xmin, -2, 2), hi = clamp(a + b*xmax, -2, 2);
    /* ease the ends back a little so the extremes stay representative */
    lo = mean + (lo - mean) * 0.88;
    hi = mean + (hi - mean) * 0.88;
    return [toneOf(stops, lo), toneOf(stops, hi)];
  }

  /* ---------- build the globe ---------- */
  function gid(c, i) { return c.ids ? c.ids[i] : i; }
  function buildGlobe() {
    var live = [];
    ST.forEach(function (s, i) { if (s[2] > 0) live.push(i); });
    var items = live.map(function (i) {
      var s = ST[i];
      var x = 0, y = 0, n = 0;
      s[4].forEach(function (o) { x += PRESS[o][0]; y += PRESS[o][1]; n++; });
      return {
        ang: Math.atan2(y / n, x / n),
        rankKey: -s[4].length,             /* broadest coverage first -> centre */
        area: s[2]
      };
    });
    globeL = layout(items);
    globeL.ids = live;
  }

  var PAINTQ = 1;
  function paint() {
    var cssW = stage.getBoundingClientRect().width;
    if (!cssW) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = clamp(Math.round(cssW * dpr * PAINTQ), 320, 980);
    cv.width = W; cv.height = W;
    R = W * 0.487; C = W / 2;

    var pal = palette();
    var gids = globeL.ids || ST.map(function (s, i) { return i; });
    globe = renderDisc(W, globeL, gids.map(function (i) { return gradeOf(i, pal.stops); }), pal, cssW);
    ctx.clearRect(0, 0, W, W);
    ctx.drawImage(globe.canvas, 0, 0);
    mode = "ready";
    levels = [{ kind: "globe", res: globe, layout: globeL, ids: gids,
                names: gids.map(function (i) { return ST[i][0]; }),
                shorts: gids.map(function (i) { return SHORT[i]; }),
                values: gids.map(function (i) {
                  var v = clamp(ST[i][3] + dstOf(i), -2, 2);
                  return (v > 0 ? "+" : "") + v.toFixed(1);
                }) }];
    fillKey(null);
    if (backBtn) backBtn.hidden = true;
    showPaperToggle();
    labelLevel(levels[0]);
  }

  /* ---------- level three: the articles behind one outlet's line ----------
     Desk matters more than anything else here: a paper's news reporting sits
     close to neutral while its comment and leaders carry the position. That is
     why desk is the angle and distance from neutral the radius.            */
  var DESKS = [
    { name: "News",     ang:  Math.PI/2, mult: 0.70, share: 0.50 },
    { name: "Analysis", ang:  Math.PI,   mult: 0.90, share: 0.18 },
    { name: "Comment",  ang:  0,         mult: 1.35, share: 0.22 },
    { name: "Leader",   ang: -Math.PI/2, mult: 1.45, share: 0.10 }
  ];
  var HEADS = {
    "News":     ["Ministers face pressure over TOPIC", "New figures published on TOPIC",
                 "MPs to debate TOPIC next week", "Report warns over TOPIC",
                 "Government defends record on TOPIC"],
    "Analysis": ["What the TOPIC row actually means", "TOPIC, explained",
                 "Behind the numbers on TOPIC"],
    "Comment":  ["TOPIC: the case against", "Why TOPIC matters more than you think",
                 "Enough is enough on TOPIC", "TOPIC and the cost of getting it wrong"],
    "Leader":   ["Our view on TOPIC", "The TOPIC question"]
  };

  /* ---------- one real cell ----------
     Everything else in this document is schematic. This is not: these are the
     actual items in Sky News's public UK and Home RSS feeds on 8 Sept 2026
     that mention asylum, migrants or the Channel, scored by the method the
     plan describes - headline plus standfirst, nothing else.

     Stance target, stated explicitly per the taxonomy rule: favourability
     toward people crossing in small boats and toward asylum seekers.        */
  var REAL = FPM.REAL;

  /* a shortened headline beats a desk label: "Fury as Home Office plans..."
     tells you something, "News" does not */
  var HEAD_MAX = 0;
  /* HSIZE scales headline type overall; HDIFF is the exponent on the natural
     size, so >1 widens the gap between big and small shapes and <1 flattens it */
  var HSIZE = 1, HDIFF = 1, HREF = 16;
  /* on the headline sphere the score is set at one fixed size for every shape,
     so it reads as a constant unit rather than as part of the headline */
  var SCORE_FS = 13;
  /* HCAP is an absolute ceiling in CSS px on any single label, applied after
     the size and differential curves; 0 means no cap */
  var HCAP = 18;
  function trimChars(t, max) {
    if (!max || t.length <= max) return t;
    var cut = t.slice(0, max);
    var sp = cut.lastIndexOf(" ");
    if (sp > max * 0.5) cut = cut.slice(0, sp);
    return cut.replace(/[\s,;:.\-]+$/, "") + "\u2026";
  }

  function trunc(t, words) {
    var w = t.split(/\s+/);
    return w.length <= words ? t : w.slice(0, words).join(" ") + "\u2026";
  }

  function articlesOf(si, oName) {
    var real = REAL[si + "|" + oName];
    if (real) {
      /* during playback, only what had been published by that day */
      var upto = TFX ? TPOS + 0.5 : 1e9;
      var its = real.items.filter(function (a) { return a.d <= upto; });
      if (!its.length) its = real.items;
      return its.map(function (a, i) {
        var d = DESKS[0];
        DESKS.forEach(function (q) { if (q.name === a.desk) d = q; });
        return { name: a.name, desk: a.desk, prom: a.prom, stance: a.stance,
                 ang: d.ang + (i - (its.length - 1) / 2) * 0.8,
                 real: a, isReal: true };
      });
    }
    var outs = outletsOf(si);
    var self = null;
    outs.forEach(function (o) { if (o.name === oName) self = o; });
    if (!self) return [];
    var topic = ST[si][0].replace(/&amp;/g, "and").toLowerCase();
    var n = 3 + Math.floor((noise(si + 1300, oName) + 1) / 2 * 6);   /* 3..8 */
    var out = [];
    for (var i = 0; i < n; i++) {
      var seed = oName + "#" + i;
      var r = (noise(si + 2100, seed) + 1) / 2;                       /* 0..1 */
      var acc = 0, desk = DESKS[0];
      for (var d = 0; d < DESKS.length; d++) { acc += DESKS[d].share; if (r <= acc) { desk = DESKS[d]; break; } }
      var stance = clamp(self.stance * desk.mult + noise(si + 2600, seed) * 0.28, -2, 2);
      var prom = 1 + Math.floor((noise(si + 3100, seed) + 1) / 2 * 3);  /* 1..3 */
      var bank = HEADS[desk.name];
      var head = bank[Math.floor((noise(si + 3700, seed) + 1) / 2 * bank.length) % bank.length]
                   .replace("TOPIC", topic);
      head = head.charAt(0).toUpperCase() + head.slice(1);   /* sentence case */
      out.push({ name: head, desk: desk.name, ang: desk.ang + noise(si + 4200, seed) * 0.42,
                 stance: stance, prom: prom });
    }
    return out;
  }

  /* ---------- levels ----------
     A stack, not a toggle: globe -> story -> outlet. Each level records what
     it needs to be re-drawn and re-labelled when the level above it closes. */
  var levels = [], trans = null;

  function cur() { return levels[levels.length - 1]; }

  function labelLevel(lv) {
    LKIND = lv.kind;
    stage.setAttribute("data-level", lv.kind);
    BAND = BANDS[lv.kind] || BANDS.globe;
    TOPBOOST = BOOSTS[lv.kind] == null ? 3 : BOOSTS[lv.kind];
    FILL = !!FILLS[lv.kind];
    var cssW = stage.getBoundingClientRect().width;
    putLabels(lv.res, lv.names, lv.shorts, lv.values, cssW);
  }

  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function drawFrame(t) {
    var e = ease(t);
    ctx.clearRect(0, 0, W, W);

    /* the level below sinks back */
    ctx.save();
    var k = 1 - 0.16 * e;
    ctx.globalAlpha = 1 - 0.74 * e;
    try { ctx.filter = "blur(" + (5 * e).toFixed(2) + "px) saturate(" + (1 - 0.5 * e).toFixed(2) + ")"; } catch (err) {}
    ctx.translate(C, C); ctx.scale(k, k); ctx.translate(-C, -C);
    ctx.drawImage(trans.bg.canvas, 0, 0);
    ctx.restore();
    ctx.filter = "none";
    ctx.globalAlpha = 1;

    /* the cell lifts out, rounds, and resolves into its own map */
    var bx = trans.ringC.x + (C - trans.ringC.x) * e;
    var by = trans.ringC.y + (C - trans.ringC.y) * e;
    ctx.save();
    ctx.beginPath();
    for (var i = 0; i < STEPS; i++) {
      var th = i / STEPS * Math.PI * 2;
      var rr = (trans.ring[i] * R) + (R - trans.ring[i] * R) * e;
      var px = bx + Math.cos(th) * rr, py = by - Math.sin(th) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(trans.flat, 0, 0);
    if (e > 0.42) {
      ctx.globalAlpha = clamp((e - 0.42) / 0.5, 0, 1);
      ctx.drawImage(trans.fg.canvas, 0, 0);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function run(from, to, ms, done) {
    if (reduce) { drawFrame(to); done && done(); return; }
    if (anim) { cancelAnimationFrame(anim.id); clearTimeout(anim.t); }
    var t0 = performance.now(), settled = false;
    function finish() {
      if (settled) return;
      settled = true;
      if (anim) { cancelAnimationFrame(anim.id); clearTimeout(anim.t); }
      anim = null;
      drawFrame(to);
      done && done();
    }
    anim = { id: 0, t: setTimeout(finish, ms * 2 + 250) };
    (function step(now) {
      if (settled) return;
      var p = clamp((now - t0) / ms, 0, 1);
      drawFrame(from + (to - from) * p);
      if (p < 1) { anim.id = requestAnimationFrame(step); }
      else { finish(); }
    })(t0);
  }

  function flatDisc(rgb, pal) {
    return renderDisc(W, { sx: new Float64Array([0]), sy: new Float64Array([0]),
                           w: new Float64Array([0]), n: 1 },
                      [[rgb, rgb]], pal, stage.getBoundingClientRect().width).canvas;
  }

  /* build the child level for cell i of the current level */
  function storyLevel(si, pal) {
    var cssW = stage.getBoundingClientRect().width;
    var outs = outletsOf(si);
    var lay = layout(outs.map(function (o) {
      return { ang: Math.atan2(o.y, o.x), rankKey: Math.abs(o.stance), area: o.sal };
    }), 0.06);
    var res = renderDisc(W, lay, outs.map(function (o) {
      var col = toneOf(pal.stops, o.stance); return [col, col];
    }), pal, cssW);
    return { kind: "story", res: res, layout: lay, items: outs, idx: si,
             names: outs.map(function (o) { return o.name; }),
             shorts: outs.map(function (o) { return o.name; }),
             values: outs.map(function (o) { return (o.stance > 0 ? "+" : "") + o.stance.toFixed(1); }),
             title: ST[si][1] };
  }

  /* ---------- one paper's whole front page ----------
     The same object as the main globe, restricted to one masthead: every issue
     that paper is running, sized by how much of its own output goes on each and
     coloured by its own line on it. Angle and radius are borrowed from the main
     globe, so a shape sits where it sits nationally - which is the point. Read
     side by side with the globe above, the difference between the two is this
     paper's editorial priorities rather than the country's. */
  function paperLevel(name, pal, fromStory, prev, cold) {
    var cssW = stage.getBoundingClientRect().width, ids = [], i;
    var tot = totalNow();
    for (i = 0; i < N; i++) {
      if (ST[i][4].indexOf(name) < 0) continue;
      if (TFX && areaOf(i) / tot <= LIVE_MIN) continue;
      if (FPM.osal(i, name, TFX ? TPOS : FPM.D - 1) <= 0) continue;
      ids.push(i);
    }
    if (!ids.length) return null;
    function mine(si) { return TFX ? outletSalAt(si, name, TPOS) : outletSalBase(si, name); }
    function whole(si) {
      var t = 0;
      ST[si][4].forEach(function (o) { t += TFX ? outletSalAt(si, o, TPOS) : outletSalBase(si, o); });
      return t;
    }
    var items = ids.map(function (si) {
      var s = ST[si], x = 0, y = 0, n = 0;
      s[4].forEach(function (o) { x += PRESS[o][0]; y += PRESS[o][1]; n++; });
      return { ang: Math.atan2(y / n, x / n), rankKey: -s[4].length,
               area: Math.max(1e-4, areaOf(si) * mine(si) / whole(si)) };
    });
    var lay = (!cold && prev && prev.layout && prev.layout.ids)
      ? relayout(prev.layout, items, 96, 12, 20, ids)
      : layout(items);
    lay.ids = ids;
    var st2 = ids.map(function (si) {
      var row = null;
      outletsOf(si).forEach(function (q) { if (q.name === name) row = q; });
      return row ? row.stance : ST[si][3];
    });
    var res = renderDisc(W, lay, st2.map(function (v) {
      var c = toneOf(pal.stops, v); return [c, c];
    }), pal, cssW);
    return { kind: "paper", res: res, layout: lay, ids: ids, outlet: name,
             fromStory: fromStory,
             names: ids.map(function (si) { return ST[si][0]; }),
             shorts: ids.map(function (si) { return SHORT[si]; }),
             values: st2.map(function (v) { return (v > 0 ? "+" : "") + v.toFixed(1); }),
             title: name + " \u2014 every issue" };
  }

  function childOf(i, pal) {
    var c = cur(), cssW = stage.getBoundingClientRect().width;
    if (c.kind === "globe") return storyLevel(gid(c, i), pal);
    /* story -> one outlet's articles */
    var art = articlesOf(c.idx, c.items[i].name);
    if (!art.length) return null;
    var lay2 = layout(art.map(function (a) {
      return { ang: a.ang, rankKey: Math.abs(a.stance), area: a.prom };
    }), 0.06);
    var res2 = renderDisc(W, lay2, art.map(function (a) {
      var col = toneOf(pal.stops, a.stance); return [col, col];
    }), pal, cssW);
    return { kind: "outlet", res: res2, layout: lay2, items: art, idx: i,
             outlet: c.items[i].name, storyIdx: c.idx,
             names: art.map(function (a) { return trimChars(a.name, HEAD_MAX); }),
             shorts: art.map(function (a) { return trunc(trimChars(a.name, HEAD_MAX), 5); }),
             values: art.map(function (a) { return (a.stance > 0 ? "+" : "") + a.stance.toFixed(1); }),
             title: c.items[i].name + " on " + ST[c.idx][1] };
  }

  function openCell(i) {
    if (PLAYING) stopPlay();
    resetLabelDamping();
    if (mode !== "ready") return;
    var c = cur();
    if (c.kind === "outlet") return;                 /* nothing deeper than an article */
    if (c.kind === "paper") { openFromPaper(i); return; }
    var anc0 = c.res.anchors[i] && c.res.anchors[i][0];
    if (!anc0) return;
    var pal = palette();
    var child = childOf(i, pal);
    if (!child) return;

    mode = "anim"; clearLabels(); hideTip();
    var stanceOf = c.kind === "globe" ? clamp(ST[gid(c, i)][3] + dstOf(gid(c, i)), -2, 2)
                                      : c.items[i].stance;
    child.ring = outline(c.layout, i, (anc0[0] - C) / R, -(anc0[1] - C) / R, STEPS);
    child.ringC = { x: anc0[0], y: anc0[1] };
    child.flat = flatDisc(toneOf(pal.stops, stanceOf), pal);
    trans = { bg: c.res, fg: child.res, ring: child.ring, ringC: child.ringC, flat: child.flat };

    fillKey(child);
    if (backBtn) { backBtn.hidden = false; backBtn.textContent = "\u2190 " + (levels.length === 1 ? "All stories" : ST[c.idx][1]); }

    run(0, 1, 640, function () {
      levels.push(child); mode = "ready"; labelLevel(child);
      if (child.kind === "story") setChartStory(child.idx);
      showPaperToggle();
    });
  }

  /* The paper view and the headline view are two readings of the same paper,
     so the toggle swaps between them in place rather than pushing a level.
     Coming from the paper view, the story underneath is rebuilt as well, so
     Back still lands somewhere that makes sense. */
  function showPaperToggle() {
    var b = document.getElementById("paperToggle");
    if (!b) return;
    var k = cur().kind;
    b.hidden = !(k === "outlet" || k === "paper");
    b.textContent = k === "paper" ? "Headlines" : "All Issues";
    b.setAttribute("data-on", k === "paper" ? "1" : "0");
  }

  function swapLevel(next) {
    if (!next) return;
    /* the level being replaced owns the morph geometry that Back animates
       through, so carry it across or Back has nothing to unwind */
    var old = levels[levels.length - 1];
    if (old) { next.ring = old.ring; next.ringC = old.ringC; next.flat = old.flat; }
    levels[levels.length - 1] = next;
    resetLabelDamping();
    ctx.clearRect(0, 0, W, W);
    ctx.drawImage(next.res.canvas, 0, 0);
    fillKey(next);
    if (backBtn) {
      backBtn.hidden = false;
      backBtn.textContent = "\u2190 " + (levels[1] && levels[1].kind === "story"
        ? ST[levels[1].idx][1] : "All stories");
    }
    showPaperToggle();
    labelLevel(next);
    if (next.kind === "paper") setChartPaper(next.outlet);
    else setChartStory(next.storyIdx != null ? next.storyIdx : -1);
  }

  function togglePaper() {
    if (mode !== "ready") return;
    if (PLAYING) stopPlay();
    var c = cur(), pal = palette();
    if (c.kind === "outlet") swapLevel(paperLevel(c.outlet, pal, c.storyIdx));
    else if (c.kind === "paper") {
      var si = c.fromStory != null ? c.fromStory : c.ids[0];
      levels[1] = storyLevel(si, pal);
      var art = articlesOf(si, c.outlet);
      if (!art.length) return;
      swapLevel(outletLevel(si, c.outlet, art, pal));
    }
  }

  function outletLevel(si, name, art, pal) {
    var cssW = stage.getBoundingClientRect().width;
    var lay2 = layout(art.map(function (a) {
      return { ang: a.ang, rankKey: Math.abs(a.stance), area: a.prom };
    }), 0.06);
    var res2 = renderDisc(W, lay2, art.map(function (a) {
      var col = toneOf(pal.stops, a.stance); return [col, col];
    }), pal, cssW);
    return { kind: "outlet", res: res2, layout: lay2, items: art, idx: 0,
             outlet: name, storyIdx: si,
             names: art.map(function (a) { return trimChars(a.name, HEAD_MAX); }),
             shorts: art.map(function (a) { return trunc(trimChars(a.name, HEAD_MAX), 5); }),
             values: art.map(function (a) { return (a.stance > 0 ? "+" : "") + a.stance.toFixed(1); }),
             title: name + " on " + ST[si][1] };
  }

  function openFromPaper(i) {
    var c = cur(), si = c.ids[i], pal = palette();
    var art = articlesOf(si, c.outlet);
    if (!art.length) return;
    levels[1] = storyLevel(si, pal);
    swapLevel(outletLevel(si, c.outlet, art, pal));
  }

  function back() {
    if (mode !== "ready" || levels.length < 2) return;
    resetLabelDamping();
    var child = levels[levels.length - 1], parent = levels[levels.length - 2];
    mode = "anim"; clearLabels(); hideTip();
    if (!child.ring || !child.ringC || !child.flat) {
      /* no morph to unwind: drop straight back rather than animating nothing */
      levels.pop();
      mode = "ready";
      ctx.clearRect(0, 0, W, W);
      ctx.drawImage(parent.res.canvas, 0, 0);
      fillKey(levels.length > 1 ? parent : null);
      if (backBtn) {
        if (levels.length === 1) backBtn.hidden = true;
        else backBtn.textContent = "\u2190 All stories";
      }
      setChartStory(parent.kind === "story" ? parent.idx : -1);
      showPaperToggle();
      labelLevel(parent);
      return;
    }
    trans = { bg: parent.res, fg: child.res, ring: child.ring, ringC: child.ringC, flat: child.flat };

    run(1, 0, 460, function () {
      levels.pop();
      mode = "ready";
      ctx.clearRect(0, 0, W, W);
      ctx.drawImage(parent.res.canvas, 0, 0);
      fillKey(levels.length > 1 ? parent : null);
      setChartStory(parent.kind === "story" ? parent.idx : -1);
      showPaperToggle();
      if (backBtn) {
        if (levels.length === 1) backBtn.hidden = true;
        else backBtn.textContent = "\u2190 All stories";
      }
      labelLevel(parent);
    });
  }

  /* ---------- the key panel ---------- */
  function bars(rows, valOf, labelOf, numOf) {
    var mx = 0; rows.forEach(function (r) { mx = Math.max(mx, valOf(r)); });
    return rows.map(function (r) {
      return "<tr><td>" + labelOf(r) + "</td>" +
        '<td class="bar"><span style="width:' + (valOf(r) / (mx || 1) * 100).toFixed(0) + '%"></span></td>' +
        '<td class="num">' + numOf(r) + "</td></tr>";
    }).join("");
  }

  function fillKey(lv) {
    if (!keyDetail || !keyMain) return;
    if (!lv) { keyMain.hidden = false; keyDetail.hidden = true; return; }
    keyMain.hidden = true; keyDetail.hidden = false;

    if (lv.kind === "paper") {
      var rows = lv.ids.map(function (si, k) {
        return { si: si, name: ST[si][1], area: lv.res.area ? lv.res.area[k] : 1,
                 stance: parseFloat(lv.values[k]) };
      });
      rows.sort(function (a, b) { return b.area - a.area; });
      keyDetail.innerHTML =
        '<div class="kd-head"><div class="kd-eyebrow">One paper, every issue</div>' +
        "<h3>" + lv.outlet + "</h3>" +
        '<div class="kd-stats"><span>' + lv.ids.length + " issues running</span>" +
        "<span>positions borrowed from the globe</span></div></div>" +
        '<div class="key-item"><div class="k-head"><span class="k-n">Now area</span>' +
        '<span class="k-t">Share of this paper</span></div>' +
        "<p>How much of <em>this masthead's</em> output goes on each issue, laid out where those " +
        "issues sit on the national globe. The difference between the two pictures is this " +
        "paper's priorities rather than the country's.</p></div>" +
        '<table class="kd-table"><thead><tr><th>Issue</th><th>Share</th><th class="num">Stance</th></tr></thead><tbody>' +
        bars(rows, function (r) { return r.area; }, function (r) { return r.name; },
             function (r) { return (r.stance > 0 ? "+" : "") + r.stance.toFixed(1); }) +
        "</tbody></table>";
      return;
    }

    if (lv.kind === "story") {
      var s = ST[lv.idx];
      var outs = lv.items.slice().sort(function (a, b2) { return b2.sal - a.sal; });
      keyDetail.innerHTML =
        '<div class="kd-head"><div class="kd-eyebrow">Story opened</div>' +
        "<h3>" + s[1] + "</h3>" +
        '<div class="kd-stats"><span>' + (areaOf(lv.idx) / totalNow() * 100).toFixed(1) + "% of coverage</span>" +
        "<span>" + s[4].length + " of " + FPM.NOUT + " papers</span>" +

  /* =========================================================
     Playback: the same globe, driven by a history of frames

     Three things had to be true before this could animate at all, and each
     one was measured rather than assumed:

     1. The cold fit in layout() costs 160-350ms and renderDisc another
        120ms at full size - about 3fps, which is not playback. Frame to
        frame the targets barely move, so playback re-fits from the previous
        frame's seeds and weights instead (relayout below): 4-14ms. The disc
        is drawn at reduced resolution while running and at full size the
        moment it stops.
     2. Radius must come from something that changes slowly. When radius is
        taken from a RANK, two stories swapping places teleports both cells:
        worst seed jump 0.62 of the disc radius against 0.35 for a stable
        key over the same 120 frames. Breadth of coverage is the stable key,
        so that is what drives radius here, exactly as in the static globe.
     3. A cell allowed to shrink towards nothing destroys the fit - it hits
        zero painted area and the weight gradient, bounded by the target,
        cannot bring it back. Every story therefore keeps a floor, and a
        cell that is squeezed out entirely gets a hard kick until it
        reappears.
     ========================================================= */
  var HDAYS = FPM.D;                        /* one frame per day collected */
  var DAYMS = 86400000;
  var HEND = FPM.HEND;                      /* the latest day */
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function frameDate(f) { return new Date(HEND - (HDAYS - 1 - f) * DAYMS); }
  function fmtDate(f) {
    var d = frameDate(f);
    return d.getUTCDate() + " " + MON[d.getUTCMonth()] + " " + d.getUTCFullYear();
  }

  /* si indexes ST; amp is the multiplier at the peak, dst the stance kick,
     hl the half-life of the decay in days */
  var EVENTS = FPM.EVENTS;

  /* Which issues exist at all on a given day. Nothing is exempt: if the NHS is
     not being written about this week it is not on the globe this week. What
     differs between issues is the duty cycle, not the privilege - a big issue
     runs in long spells with short gaps, a small one appears now and then -
     and it is derived from the issue's own volume rather than assigned. Every
     issue's closing spell reaches the present, because the last frame is the
     globe as it stands today. */
  var RAMP = 4;
  function hash01(a, b) {
    var h = Math.imul(a * 374761393 + b * 668265263, 1274126177);
    h = (h ^ (h >>> 15)) >>> 0;
    return h / 4294967296;
  }
  var LIVEW = (function () {
    var vols = ST.map(function (s) { return s[2]; });
    var mx = Math.max.apply(null, vols), mn = Math.min.apply(null, vols);
    var out = [];
    for (var k = 0; k < N; k++) {
      var t = (vols[k] - mn) / (mx - mn || 1);
      var duty = 0.42 + 0.50 * Math.pow(t, 0.55);       /* 0.42 .. 0.92 */
      var meanOn = 12 + 34 * duty;
      var meanOff = meanOn * (1 - duty) / duty;
      var ws = [], at = -Math.round(20 + hash01(k, 91) * 40), j = 0;
      while (at < HDAYS + 20 && j < 40) {
        var on = Math.max(5, Math.round(meanOn * (0.6 + 0.8 * hash01(k, j))));
        ws.push([at, at + on]);
        /* a gap has to outlast both ramps or the issue never actually reaches
           zero, and a big issue would be exempt in practice however uniform
           the rule looked */
        at += on + Math.max(2 * RAMP + 5, Math.round(meanOff * (0.5 + hash01(k, j + 500))));
        j++;
      }
      /* the closing spell is staggered hard, so issues rejoin the present a few
         at a time rather than all switching on together at the end */
      ws.push([HDAYS - 1 - (4 + Math.round(128 * hash01(k, 777))), HDAYS - 1]);
      EVENTS.forEach(function (e) { if (e.si === k) ws.push([e.d - 9, e.d + 24]); });
      out.push(ws);
    }
    return out;
  })();
  function smooth01(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function aliveAt(i, f) {
    var ws = LIVEW[i], best = 0;
    for (var k = 0; k < ws.length; k++) {
      var a = ws[k][0], b = ws[k][1];
      if (f < a - RAMP || f > b + RAMP) continue;
      var v = Math.min(smooth01((f - (a - RAMP)) / RAMP), smooth01(((b + RAMP) - f) / RAMP));
      if (v > best) best = v;
    }
    return best;
  }

  /* the history itself: a slow wave per story, floored, then event pulses */
  var HIST = FPM.HIST;

  /* while TFX is set, the globe reads its areas and stances from here */
  var TFX = null, TPOS = HDAYS - 1;
  function areaOf(i) { return TFX ? TFX.area[i] : ST[i][2]; }
  function dstOf(i)  { return TFX ? TFX.dst[i] : 0; }
  function totalNow() {
    if (!TFX) return total;
    var s = 0; for (var i = 0; i < N; i++) s += TFX.area[i];
    return s;
  }
  function setTFX(pos) {
    TPOS = pos;
    var f0 = Math.floor(pos), f1 = Math.min(HDAYS - 1, f0 + 1), u = pos - f0;
    var a = new Float64Array(N), d = new Float64Array(N);
    for (var i = 0; i < N; i++) {
      a[i] = HIST.share[f0 * N + i] * (1 - u) + HIST.share[f1 * N + i] * u;
      d[i] = HIST.dst[f0 * N + i]   * (1 - u) + HIST.dst[f1 * N + i]   * u;
    }
